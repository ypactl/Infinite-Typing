<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Typing</title>
</head>
  <body>
    <style>
      html {
        background-color: #000000;
        color: #ffffff;
        font-family: "monospace", monospace;
      }
    </style>
    <input id="mainchars" placeholder="update plz">
    <p id="resuchars"></p>
    <script>
      var game = {
        chars: 0,
        lastch: ""
      }
      setInterval(() => {
        var charinput = document.getElementById("mainchars")
        game.chars += charinput.value.length
        game.lastch += charinput.value
        game.lastch = game.lastch.slice(-100)
        document.charinput.value = ""
        document.charinput.placeholder = game.chars>0?"KEEP TYPING.":"START TYPING."
        document.getElementById("resuchars").innerHTML = game.chars+" chars ~ "+game.lastch
      }, 20)
    </script>
  </body>
</html>
