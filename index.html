<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Typing</title>
</head>
  <body>
    <style>
      html {
        background-color: #000000;
        color: #ffffff;
        font-family: "monospace", monospace;
      }
      input {
        font-family: "monospace", monospace;
        opacity: 0;
        color: #ffffff;
      }
      button {
        font-family: "monospace", monospace;
        background-color: #000000;
        color: #ffffff;
        width: 300px;
        height: 40px;
        border: none;
        border-radius: 0px;
        justify-content: center;
      }
      button:hover {
        background-color: #ffffff;
        color: #000000;
      }
    </style>
    <button onclick="save()">SAVE</button><button onclick="load()">LOAD</button><button onclick="reset()">RESET</button>
    <h1 id="guider" style="text-align: center; opacity: 0;"></h1>
    <input id="mainchars" placeholder="update plz">
    <p id="resuchars"></p>
    <button id="newgen" onclick="newgenerator()">update plz</button>
    <p id="newgent">update plz</p>
    <script>
      var nt = new Date().getTime()
      var ot = nt
      var game = {
        chars: 0,
        gen: 0,
        lastch: "",
        textbuffer: [],
        texttime: new Date().getTime(),
        unkch: "",
        flagsN: {
          hasStarted: 0,
          thousand: 0,
          spam: 0,
          unknownchar: 0
        },
        flagsT: {
          hasStarted: ["'Hello, user.'", "'You have started typing.'", "'I do not know what to say here, since you have just came.'", "'I will leave you to it.'", "'Expect me at around 1000 chars.'", "''"],
          thousand: ["'I do not have anything planned at this point.'", "'You can check back in a few days when the developer, known as YURI, updates this game.'", "'Do not even think about how he got his name. Of course I know how, because he made me, the GUIDER.'", "''"],
          spam: ["'kK'.includes(game.lastch[0])?'Never do this again.':game.lastch.substring(90)", "'kK'.includes(game.lastch[0])?'Seriously.':'100 '+game.lastch[0]+'.'", "''"],
          unknownchar: ["'What is a '+game.unkch+'?'","'Do you have a keyboard that I am unaware of?'","''"]
        }
      }
      var init = structuredClone(game)
      function reset() {
        game = structuredClone(init)
        game.texttime = new Date().getTime()
      }
      function newgenerator() {
        if (game.chars >= 1.4**game.gen) {
          game.chars-=1.4**game.gen
          game.gen++
        }
      }
      function ui() {
        nt = new Date().getTime()
        var del = nt-ot
        ot = nt
        var charinput = document.getElementById("mainchars")
        var guider = document.getElementById("guider")
        game.chars += charinput.value.length + del/10000*(game.gen**2+game.gen)
        game.lastch += charinput.value
        game.lastch = game.lastch.slice(-100)
        charinput.value = ""
        charinput.placeholder = game.chars>0?"KEEP TYPING.":"START TYPING."
        document.getElementById("resuchars").innerHTML = game.chars.toFixed(0)+" chars ~ "+game.lastch
        if (game.chars > 0 && game.flagsN.hasStarted < 1) game.flagsN.hasStarted++
        if (game.chars > 999 && game.flagsN.thousand < 1) game.flagsN.thousand++
        if (game.lastch == game.lastch.substring(0,1).repeat(100) && game.lastch.length > 0 && game.flagsN.spam < 1) game.flagsN.spam++
        let unkch = [...game.lastch].map(v => v.codePointAt()).filter((v) => {return v>=256})
        if (unkch.length > 0 && game.flagsN.unknownchar < 1) {
          game.unkch = String.fromCharCode(unkch[0])
          game.flagsN.unknownchar++
        }
        for (i in game.flagsN) {
          if (game.flagsN[i] == 1) {
            game.flagsN[i]++
            game.textbuffer = game.flagsT[i].map(v => eval(v))
            game.texttime = new Date().getTime()-5000
          }
        }
        if (new Date().getTime()-5000 > game.texttime && game.textbuffer.length > 0) {
          guider.innerHTML = game.textbuffer[0]
          game.textbuffer.splice(0,1)
          game.texttime+=5000
        }
        guider.style.opacity = (Math.sin((new Date().getTime() - game.texttime - 1250)/2500*Math.PI)+1)*2.5
        document.getElementById("newgen").innerHTML = "Generator Cost: "+(1.4**game.gen).toFixed(2)
        document.getElementById("newgent").innerHTML = "You have "+game.gen+" generators, giving you "+0.1*(game.gen**2+game.gen).toFixed(0)+" chars per second."
        requestAnimationFrame(ui)
      }
      function load() {
        try {
          let t = atob(localStorage.file).split("/n")
          for (let i = 0; i < t.length; i++) {
            if (t[i].includes("=")) {
              eval(t[i])
            }
          }
        } catch (e) {
        }
      }
      load()
      ui()
      function save() {
        localStorage.file = btoa("game.chars = "+game.chars+"/n game.gen="+game.gen+"/n game.flagsN="+JSON.stringify(game.flagsN)+"/n game.flagsT="+JSON.stringify(game.flagsT))
      }
      setInterval(save, 10000)
    </script>
  </body>
</html>
