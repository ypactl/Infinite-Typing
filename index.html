<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Typing</title>
</head>
  <body>
    <style>
      html {
        background-color: #000000;
        color: #ffffff;
        font-family: "monospace", monospace;
      }
    </style>
    <input id="mainchars" placeholder="update plz">
    <p id="resuchars"></p>
    <script>
      var game = {
        chars: 0,
        lastch: ""
      }
      setInterval(() => {
        game.chars += document.getElementById("mainchars").value.length
        game.lastch += document.getElementById("mainchars").value
        game.lastch = game.lastch.slice(-100)
        document.getElementById("mainchars").value = ""
        document.getElementById("mainchars").placeholder = game.chars>0?"KEEP TYPING.":"START TYPING."
        document.getElementById("resuchars").innerHTML = chars+" chars ~ "+lastch
      }, 20)
    </script>
  </body>
</html>
