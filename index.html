<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Typing</title>
</head>
  <body>
    <style>
      html {
        background-color: #000000;
        color: #ffffff;
        font-family: "monospace", monospace;
      }
      input {
        font-family: "monospace", monospace;
        background-color: #00000000;
        color: #ffffff;
      }
      button {
        font-family: "monospace", monospace;
        width: 100px;
        min-height: 40px;
        border: none;
        border-radius: 0px;
      }
      .layer0 {
        display: block;
        background-color: #000000;
        color: #ffffff;
      }
      .layer0:hover {
        background-color: #ffffff;
        color: #000000;
      }
      .layer1 {
        display: none;
        background-color: #00ff00;
        color: #ffffff;
      }
      .layer1:hover {
        background-color: #ffffff;
        color: #00ff00;
      }
      
      .layer2 {
        display: none;
        background-color: #ffbfff;
        color: #ffffff;
      }
      .layer2:hover {
        background-color: #ffffff;
        color: #ffbfff;
      }
      .layer3 {
        display: none;
        background-color: #00ffff;
        color: #ffffff;
      }
      .layer3:hover {
        background-color: #ffffff;
        color: #00ffff;
      }
    </style>
    <button onclick="save()">SAVE</button><button onclick="load()">LOAD</button><button onclick="reset()">RESET</button><br>
    <button onclick="switchl(-1)" style="width: 40px;">«</button><button onclick="switchl(1)" style="width: 40px;">»</button>
    <p>There is no offline progress yet. You should have this tab open at all times if you want progress for the next hours.</p>
    <h1 id="guider" style="text-align: center; opacity: 0;"></h1>
    <input id="mainchars" placeholder="update plz" maxlength=10>
    <p id="resuchars"></p>
    <p id="booked"></p>
    <p id="warns">update plz</p>
    <button class="layer0" id="newgen" onclick="newgenerator()">update plz</button>
    <p id="newgent">update plz</p>
    <button id="unldo" class="layer1" style="display: block;" onclick="if(game.chars>=65536){game.chars-=65536; game.downloaded = true; game.flagsN.downloaded = Math.max(game.flagsN.downloaded,1); game.layersunl = Math.max(game.layersunl, 1); this.style.display = 'none'}">Unlock download - 65536 chars</button>
    <p id="dtext">update plz</p>
    <button class="layer1" id="incdown" onclick="increasespeed()">update plz</button>
    <p id="incdownt">update plz</p>
    <button class="layer1" id="incpow" onclick="increasepower()">update plz</button>
    <p id="incpowt">update plz</p>
    <button id="unlac" class="layer2" style="display: block;" onclick="if(game.chars>=524288){game.chars-=524288; game.logged = true; game.flagsN.logged = Math.max(game.flagsN.logged,1); game.layersunl = Math.max(game.layersunl, 2); this.style.display = 'none'}">Unlock account - 524288 chars</button>
    <input id="namer" maxlength="25" placeholder="Enter an = to submit." oninput="checkname(this)">
    <button class="layer2" id="svmul" onclick="multsoftcap()">update plz</button>
    <p id="svmult">update plz</p>
    <button class="layer2" id="l2u" onclick="multpp()">update plz</button>
    <p id="l2ut">update plz</p>
    <button id="unlco" class="layer3" style="display: block;" onclick="if(game.chars>=1e12){game.chars-=1e12; game.logged = true; game.flagsN.logged = Math.max(game.flagsN.logged,1); game.layersunl = Math.max(game.layersunl, 3); this.style.display = 'none'}">Unlock account - 1e12 chars</button>
    <p id="deb"></p>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById("deb").innerHTML = ("Message: " + message + "<br>" + "Line: " + lineno + "Col: " + colno).repeat(Number(document.getElementById("namer").value == "YPACTL"))
        return true
      }
      var nt = new Date().getTime()
      var ot = nt
      var namer = {

      var books = [

      ].map(v => atob(v))
      var bookl = [0,0,0]
      bookl.push(bookl[2]+books[0].length)
      books=books.join("")
      var game = {
        chars: 0,
        gen: 0,
        lastch: "",
        textbuffer: [],
        texttime: new Date().getTime(),
        unkch: "",
        downloaded: false,
        logged: false,
        name: "USER",
        power: 0,
        powerpower: 0,
        svmul: 0,
        ppmul: false,
        comps: 1,
        layersunl: 0,
        layer: 0,
        bookc: 0,
        flagsN: {
          hasStarted: 0,
          thousand: 0,
          spam: 0,
          unknownchar: 0,
          thrytwgen: 0,
          downloaded: 0, 
          firstpp: 0,
          maxlength: 0,
          logged: 0,
          named: 0
        },
        flagsT: {
          hasStarted: ["'Hello, '+game.name+'.'", "'You have started typing.'", "'I do not know what to say here, since you have just came.'", "'I will leave you to it.'", "'Expect me at around 1000 chars.'", "''"],
          thousand: ["'I forgot to tell you something.'", "'I know the developer, YURI, by code, and he likes to put as much effort into this game,'", "'Which is why he planned a lot of layers.'", "'There are 3 layers as of now, naming them LAYER0 to LAYER2.'", "'Do not ask why, he likes naming things this way.'", "'Get to 65536 chars to see the next layer.'", "''"],
          spam: ["'kK'.includes(game.lastch[0])?'Never do this again.':game.lastch.substring(90)", "'kK'.includes(game.lastch[0])?'Seriously.':'100 '+game.lastch[0]+'.'", "''"],
          unknownchar: ["'What is a '+game.unkch+'?'","'Do you have a keyboard that I am unaware of?'","''"],
          thrytwgen: ["game.flagsN.downloaded = 2; 'You know that there was a faster way to get to 65536 chars?'", "'You missed that oppurtunity.'", "'I was going to say something about unlocking downloads, but I forgot it.'", "''"],
          downloaded: ["game.flagsN.thrytwgen = 2; 'There is not anything planned at this point.'", "'You can check back in a few days when the developer updates this game.'", "''"],
          firstpp: ["'He just could not think of a better name than this.'", "'I could have called it Download Accelerator, or Power Accelerator.'", "'Even worse, when he made this set of dialogue, he called this flag firstpp.'", "'I know it was not intentional. I have seen his naming quirks before.'", "''"],
          maxlength: ["'Unless you have really fast hands that can type 600 chars per second,'", "'I can tell when you are pasting anything. It is capped at 10 chars per frame, because the developer knows people will abuse it.'", "''"],
          logged: ["'There was an input sitting there for a while. I need you to type some name.'", "'You can choose to leave it, but I will call you USER.'", "''"],
          named: []
        }
      }
      var init = structuredClone(game)
      function reset() {
        game = structuredClone(init)
        localStorage.file=""
        load()
        save()
      }
      function checkname(x) {
        x.value = x.value.toUpperCase().split("").filter((v) => {return "ABCDEFGHIJKLMNOPQRSTUVWXYZ=".includes(v)}).join("")
        if (x.value.includes("=")) {
          x.value = x.value.replaceAll("=","")
          game.name = x.value || "USER"
          game.textbuffer = [...(namer[game.name] ?? namer[""])]
          game.texttime = new Date().getTime()-5000
          game.flagsN.named = 2
        }
      }
      function switchl(x) {
        document.querySelectorAll(".layer"+game.layer).forEach(v => {v.style.display = "none"})
        game.layer=((game.layer+x)%(game.layersunl+1)+game.layersunl+1)%(game.layersunl+1)
        document.querySelectorAll(".layer"+game.layer).forEach(v => {v.style.display = "block"})
        document.getElementById("unldo").style.display = "none"
        document.getElementById("unlac").style.display = "none"
        document.getElementById("unlco").style.display = "none"
        if (game.layersunl == 0) document.getElementById("unldo").style.display = "block"
        if (game.layersunl == 1) document.getElementById("unlac").style.display = "block"
        if (game.layersunl == 2) document.getElementById("unlco").style.display = "block"
      }
      function newgenerator() {
        if (game.chars >= 1.4**game.gen) {
          game.chars-=1.4**game.gen
          game.gen++
        }
      }
      function increasespeed() {
        if (game.chars >= 50000+10000*game.power) {
          game.chars-=50000+10000*game.power
          game.power++
        }
      }
      function increasepower() {
        if (game.chars >= 150000*(1+game.powerpower)) {
          game.chars-=150000*(1+game.powerpower)
          game.powerpower++
          game.flagsN.firstpp = Math.max(game.flagsN.firstpp, 1)
        }
      }
      function multsoftcap() {
        if (game.chars >= 1000000*1.25**game.svmul) {
          game.chars-=1000000*1.25**game.svmul
          game.svmul++
        }
      }
      function multpp() {
        if (game.chars >= 5000000 && !game.ppmul) {
          game.chars-=5000000
          game.ppmul=true
        }
      }
      function ui() {
        nt = new Date().getTime()
        var del = nt-ot
        ot = nt
        var charinput = document.getElementById("mainchars")
        var chinlen = [...charinput.value]
        if (chinlen.length == 10) {
          game.flagsN.maxlength++
        }
        var guider = document.getElementById("guider")
        game.chars += chinlen.length + del/10000*(game.gen**2+game.gen) + ((game.downloaded*del*(1+game.power/1000*(100+50*1.25**(game.svmul*game.ppmul)*game.powerpower)))/3**Number(game.chars>=1e6*1.25**game.svmul))**(1/Math.sqrt(Math.log10(Math.max(game.chars, 1e12))-11))
        game.lastch += charinput.value
        game.lastch = game.lastch.slice(-100)
        let bookcheck = 0
        while (game.bookc < bookl[game.layersunl] && books[game.bookc] == chinlen[bookcheck]) {
          game.bookc++
        }
        charinput.value = ""
        charinput.placeholder = game.chars>0?"KEEP TYPING.":"START TYPING."
        document.getElementById("resuchars").innerHTML = game.chars.toFixed(0)+" chars ~ "+game.lastch
        if (game.chars >= 1 && game.flagsN.hasStarted < 1) game.flagsN.hasStarted++
        if (game.chars >= 1000 && game.flagsN.thousand < 1) game.flagsN.thousand++
        if (game.gen >= 33 && !game.flagsN.downloaded && game.flagsN.thrytwgen < 1) game.flagsN.thrytwgen++
        if (game.lastch == game.lastch.substring(0,1).repeat(100) && game.lastch.length > 0 && game.flagsN.spam < 1) game.flagsN.spam++
        let unkch = [...game.lastch].map(v => v.codePointAt()).filter((v) => {return v>=256})
        if (unkch.length > 0 && game.flagsN.unknownchar < 1) {
          game.unkch = String.fromCharCode(unkch[0])
          game.flagsN.unknownchar++
        }
        for (i in game.flagsN) {
          if (game.flagsN[i] == 1) {
            game.flagsN[i]++
            game.textbuffer = game.flagsT[i].map(v => eval(v))
            game.texttime = new Date().getTime()-5000
          }
        }
        if (new Date().getTime()-5000 > game.texttime && game.textbuffer.length > 0) {
          guider.innerHTML = game.textbuffer[0]
          game.textbuffer.splice(0,1)
          game.texttime+=5000
        }
        let warns = []
        if (game.chars >= 1e6*1.25**game.svmul) {
          warns.push("You have exceeded "+(1e6*1.25**game.svmul).toFixed(0)+" chars, causing a data leak. As a result, your production has been cut by 67%.")
        }
        if (game.chars >= 1e12) {
          warns.push("You have exceeded 1e12 chars, causing slower storage. As a result, your download speed has been rooted by "+(Math.sqrt(Math.log10(game.chars)-11)).toFixed(2)+".")
        }
        guider.style.opacity = (Math.sin((new Date().getTime() - game.texttime - 1250)/2500*Math.PI)+1)*2.5
        document.getElementById("newgen").innerHTML = "Generator Cost: "+(1.4**game.gen).toFixed(2)
        document.getElementById("newgent").innerHTML = ("You have "+game.gen+" generators, giving you "+((game.gen**2+game.gen)/10).toFixed(0)+" chars per second.").repeat(Number(game.layer==0))
        document.getElementById("dtext").innerHTML = ("You are downloading "+(1000+game.power*(100+50*1.25**(game.svmul*game.ppmul)*game.powerpower))+" chars per second").repeat(Number(game.layer==1))
        document.getElementById("incdownt").innerHTML = ("You have "+game.power+" download power, adding "+((100+50*1.25**(game.svmul*game.ppmul)*game.powerpower)*game.power)+" chars to download speed.").repeat(Number(game.layer==1))
        document.getElementById("incdown").innerHTML = "Download Power Cost: "+(50000+10000*game.power)
        document.getElementById("incpowt").innerHTML = ("You have "+game.powerpower+" download power^2, adding "+(50*1.25**(game.svmul*game.ppmul)*game.powerpower)+" chars more on each download power.").repeat(Number(game.layer==1))
        document.getElementById("incpow").innerHTML = "Download Power^2 Cost: "+(150000*(1+game.powerpower))
        document.getElementById("svmul").innerHTML = "Multiply Softcap Cost: "+(1e6*1.25**game.svmul).toFixed(0)
        document.getElementById("svmult").innerHTML = ("The softcap is currently at "+(1e6*1.25**game.svmul).toFixed(0)+" chars.").repeat(Number(game.layer==2))
        document.getElementById("l2u").innerHTML = "Multiply Download Power^2 Cost: 5000000"
        document.getElementById("l2ut").innerHTML = (["","Download Power^2 is now "+(1.25**game.svmul).toFixed(2)+" times stronger."][Number(game.ppmul)]).repeat(Number(game.layer==2))
        document.getElementById("warns").innerHTML = warns.join("<br>")
        document.getElementById("booked").innerHTML = game.layersunl < 3 ? "Unlock layer 3" : ("This is your book. You have to type a certain combination of characters.<br>"+books.substring(game.bookc-100,game.bookc))
        requestAnimationFrame(ui)
      }
      function load() {
        try {
          eval(atob(localStorage.file))
        } catch (e) {
        }
        if (game.downloaded) {
          document.getElementById("unldo").style.display = "none"
        }
        if (game.logged) {
          document.getElementById("unlac").style.display = "none"
        }
        game.texttime = new Date().getTime()
        game.textbuffer = [""]
      }
      load()
      switchl(0)
      ui()
      function save() {
        localStorage.file = btoa("game.chars = "+game.chars
                                 +"\ngame.gen="+game.gen
                                 +"\ngame.layersunl="+game.layersunl
                                 +"\ngame.downloaded="+game.downloaded
                                 +"\ngame.logged="+game.logged
                                 +"\ngame.name="+'"'+game.name+'"'
                                 +"\ngame.power="+game.power
                                 +"\ngame.powerpower="+game.powerpower
                                 +"\ngame.svmul="+game.svmul
                                 +"\ngame.ppmul="+game.ppmul
                                 +"\ngame.bookc="+game.bookc
                                 +"\ngame.comps="+game.comps
                                 +"\ngame.flagsN="+JSON.stringify(game.flagsN)
                                )
      }
      setInterval(save, 10000)
    </script>
